---
name: build

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

env:
  go_version: '1.25'

jobs:
  golangci-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee
        with:
          version: v2.7

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.go_version }}
      - name: Test
        run: go test -v ./...

  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.go_version }}
      - name: Set up QEMU for cross-platform Docker buildx
        uses: docker/setup-qemu-action@v4
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89
        with:
          distribution: goreleaser
          version: '~> 2'
          args: release --snapshot --clean
      - name: Run gorge
        run: ./dist/gorge_linux_amd64_v1/gorge version

  tests:
    needs:
      - golangci-lint
      - test
      - goreleaser
    runs-on: ubuntu-24.04
    name: Test suite
    steps:
      - run: echo Test suite completed
